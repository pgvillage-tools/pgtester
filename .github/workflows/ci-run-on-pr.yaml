name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The required checks also run in the merge queue: the tested commit is what lands on main
  merge_group:

permissions:
  contents: read

env:
  # Golang version to use across CI steps
  GOLANG_VERSION: '1.26' # As we have go toolchain 1.23 specified in go.mod

jobs:
  check-go:
    name: Ensure Go modules synchronicity
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true
      - name: Download all Go modules
        run: |
          go mod download
      - name: Check for tidiness of go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- .

  lint-go:
    name: Lint Go code
    runs-on: ubuntu-22.04
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Built with go install (from the Go module proxy) instead of downloaded from GitHub releases
          version: v2.15.0
          install-mode: goinstall
          args: --verbose

  unittests:
    name: Run unittests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Integration tests
        run: |
          make check-coverage

  integrationtests:
    strategy:
      matrix:
        PGVERSION: ['13', '14', '15', '16', '17']
    env:
      PGVERSION: '{{ matrix.PGVERSION }}'
    name: Run integration tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      # Uses the docker compose plugin of the runner, instead of a download from GitHub releases
      - name: docker compose version
        run: |
          docker compose version
      - name: postgres
        run: |
          docker compose up -d postgres
      - name: pgtester
        run: |
          docker compose up pgtester --exit-code-from pgtester

  # The only required check of this workflow, so the ruleset doesn't change when jobs are added. It must always run,
  # and only passes when every job it needs succeeded (a skipped required check would count as a pass).
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - check-go
      - lint-go
      - unittests
      - integrationtests
    if: always()
    steps:
      - name: Evaluate the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Results: ${RESULTS}"
          if [ "$(echo "${RESULTS}" | jq -r 'all(. == "success")')" != true ]; then
            echo "::error::All CI jobs must succeed"
            exit 1
          fi
